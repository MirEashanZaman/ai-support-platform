name: CI — Lint, Build, Postgres RLS & 104-Question AI Eval Suite

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-and-evals-verify:
    name: Backend (Lint, Build, Real Postgres 16 RLS & AI Evals)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: ai_support_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_support_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres_password
      DATABASE_NAME: ai_support_platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

      - name: Build NestJS Backend
        working-directory: ./backend
        run: npm run build

      - name: Verify Embeddable Widget Bundle
        run: node --check widget/src/widget.js

      - name: Run Unit & Real PostgreSQL 16 RLS Tenant Isolation Tests
        working-directory: ./backend
        run: npm test

      - name: Run 104-Question AI RAG Evaluation Benchmark Gate
        run: node evals/run-evals.js
