name: CI — Lint, Build, Postgres RLS & 104-Question AI Eval Suite

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-and-evals-verify:
    name: Backend (Lint, Build, Postgres RLS & AI Evals)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

      - name: Build NestJS Backend
        working-directory: ./backend
        run: npm run build

      - name: Verify Embeddable Widget Bundle
        run: node --check widget/src/widget.js

      - name: Run Unit & Postgres RLS Tenant Isolation Tests
        working-directory: ./backend
        run: npm test

      - name: Run 104-Question AI RAG Evaluation Benchmark Gate
        run: node evals/run-evals.js
