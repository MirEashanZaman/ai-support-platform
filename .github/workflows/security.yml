name: Security — SAST (CodeQL), SCA (npm audit), Gitleaks, Trivy & OWASP ZAP DAST

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # 1. SCA (Software Composition Analysis) — npm audit
  sca-npm-audit:
    name: SCA (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Run npm audit (critical threshold)
        working-directory: ./backend
        run: npm audit --audit-level=critical || true

  # 2. SAST (Static Application Security Testing) — GitHub CodeQL
  sast-codeql:
    name: SAST (GitHub CodeQL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL for JavaScript and TypeScript
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # 3. Secret Scanning — Gitleaks
  secret-scan-gitleaks:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # 4. Container Scan — Trivy on Backend Docker Image
  container-scan-trivy:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t ai-support-platform-backend:ci ./backend

      - name: Run Trivy Vulnerability Scanner on Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ai-support-platform-backend:ci"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  # 5. DAST (Dynamic Application Security Testing) — OWASP ZAP Baseline Scan
  dast-owasp-zap:
    name: DAST (OWASP ZAP Baseline Scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Docker Compose Stack (Postgres pgvector, Redis, RabbitMQ)
        run: |
          cp .env.example .env
          docker compose up -d
          sleep 10

      - name: Setup Node.js 22 & Start NestJS API Locally
        working-directory: ./backend
        run: |
          npm ci
          npm run build
          nohup node dist/main.js > /tmp/backend.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -s http://localhost:4000/health | grep -q "ok"; then
              echo "Backend is healthy!"
              break
            fi
            sleep 2
          done

      - name: Run OWASP ZAP Baseline Scan against Local API
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:4000/health"
          fail_action: false
